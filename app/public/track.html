<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track your visit | Pawshift</title><link rel="icon" href="/assets/favicon.svg"><link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Unbounded:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head><body><main><div class="wrap" style="padding-top:30px">
<h2>Track your visit</h2><p class="lead">Enter the booking ID from your receipt. Tracking starts once payment is confirmed.</p>
<form id="f" style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px"><input id="id" placeholder="PS-XXXXXX" style="max-width:260px;margin:0;text-transform:uppercase" required><button class="btn">Find booking</button></form><p id="m" class="note err"></p>
<div class="trk hide" id="T"><div class="card"><h3 id="ti" style="font-size:22px"></h3><p class="note" id="su"></p><ol class="tlv" id="tv"></ol><button class="btn alt" id="sim">Simulate the visit (demo)</button></div>
<div><svg class="map" viewBox="0 0 400 260" role="img" aria-label="Carer route map"><path d="M0 60q80 30 160 0t240 20M0 190q120-40 220 10t180-20" fill="none" stroke="#bfe9f7" stroke-width="18"/><path id="rt" d="M50 210C110 210 120 120 200 130S300 60 350 50" fill="none" stroke="#14122B" stroke-width="4" stroke-dasharray="3 9" stroke-linecap="round"/>
<g transform="translate(50 210)"><rect x="-16" y="-16" width="32" height="32" rx="9" fill="#C6F432" stroke="#14122B" stroke-width="3"/><text y="5" text-anchor="middle" font-size="12" font-weight="800">P</text></g><g transform="translate(350 50)"><path d="M-18 4L0-18l18 22v18h-36z" fill="#FFD23F" stroke="#14122B" stroke-width="3"/></g>
<g id="dot"><circle r="15" fill="#FF6B2C" stroke="#14122B" stroke-width="3"/><circle r="5" fill="#fff"/></g></svg><div class="card hide" id="ph" style="margin-top:18px;text-align:center"><img id="pi" alt="" width="120"><p id="pc"></p></div></div></div>
</div></main><script src="/js/common.js"></script>
<script>let tmr,sim,cur=0,tgt=0;const rt=$('#rt'),L=rt.getTotalLength(),dot=$('#dot');
function put(f){const p=rt.getPointAtLength(f*L);dot.setAttribute('transform',`translate(${p.x} ${p.y})`)}put(0);
(function an(){cur+=(tgt-cur)*.04;put(cur);requestAnimationFrame(an)})();
function render(b){$('#T').classList.remove('hide');$('#ti').textContent=`${b.pet}'s visit, ${b.date}`;$('#su').textContent=`${b.slot} | Carer ${b.carer} | ${b.id}`;
 $('#tv').innerHTML=b.stages.map((s,i)=>{const e=b.events.find(x=>x.stage===i);return`<li class="${i<=b.stage?'on':''} ${i===b.stage&&b.stage<5?'cur':''}"><div>${esc(s)}<small>${e?new Date(e.at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'Waiting'}</small></div></li>`}).join('');
 tgt=[0,0,.82,1,1,1][b.stage]||0;$('#ph').classList.toggle('hide',b.stage<4);if(b.stage>=4){$('#pi').src=`/assets/${b.animal}.svg`;$('#pc').textContent=`${b.pet} was fed, played with and checked. All good!`}
 $('#sim').classList.toggle('hide',b.stage>=5);if(b.stage>=5){clearInterval(sim);sim=null;$('#sim').textContent='Simulate the visit (demo)'}}
async function load(id){clearInterval(tmr);$('#m').textContent='';try{const b=await api('/bookings/'+encodeURIComponent(id.trim()));if(b.stage<0){$('#T').classList.add('hide');$('#m').textContent='This booking is not paid yet. Pay to start tracking.';return}
 render(b);tmr=setInterval(()=>api('/bookings/'+b.id).then(render).catch(()=>{}),3000);$('#sim').onclick=()=>{if(sim){clearInterval(sim);sim=null;$('#sim').textContent='Simulate the visit (demo)';return}$('#sim').textContent='Stop simulation';const step=()=>api(`/bookings/${b.id}/advance`,{method:'POST'}).then(render).catch(e=>toast(e.message));step();sim=setInterval(step,3500)}}catch(e){$('#T').classList.add('hide');$('#m').textContent=e.message}}
$('#f').onsubmit=e=>{e.preventDefault();history.replaceState(0,'','?id='+encodeURIComponent($('#id').value));load($('#id').value)};
const q=new URLSearchParams(location.search).get('id')||(()=>{try{return localStorage.getItem('pawshift:last')}catch(e){}})();if(q){$('#id').value=q;load(q)}</script></body></html>
