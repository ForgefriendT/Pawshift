<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Play | Pawshift</title><link rel="icon" href="/assets/favicon.svg"><link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Unbounded:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head><body><main><div class="wrap" style="padding-top:30px">
<h2>Treat Catch</h2><p class="lead">Slide your pal to catch treats. Skip the socks and the chocolate. Score 20 or more to unlock a 5% coupon.</p>
<div class="grid g2" style="align-items:start"><div><div class="chips" id="pk"></div><canvas id="gc" width="640" height="420" aria-label="Game area"></canvas><p class="note" style="text-align:center">Drag, use the arrow keys, or press A and D. Press Space to start.</p><p style="text-align:center"><button class="btn" id="st">Start game</button></p></div>
<div class="card"><h3 style="font-size:20px;margin-bottom:10px">Top players</h3><ol class="lb" id="lb"></ol><div id="rw" class="hide"><h3 style="font-size:18px;margin:16px 0 6px">Your score: <span id="sc"></span></h3><label>Name for the leaderboard<input id="nm" maxlength="16"></label><button class="btn alt" id="sub">Save score</button><p id="cp" class="ok"></p></div></div></div>
</div></main><script src="/js/common.js"></script>
<script>const cv=$('#gc'),x=cv.getContext('2d'),W=640,Hh=420;let pet='dog',imgs={};['dog','cat','rabbit','guinea','bird','fish'].forEach(k=>{const i=new Image();i.src=`/assets/${k}.svg`;imgs[k]=i});
$('#pk').innerHTML=Object.keys(imgs).map(k=>`<button class="chip" aria-pressed="${k==pet}" data-k="${k}"><img src="/assets/${k}.svg" alt="${k}"></button>`).join('');$('#pk').onclick=e=>{const b=e.target.closest('button');if(b){pet=b.dataset.k;$$('#pk .chip').forEach(c=>c.setAttribute('aria-pressed',c===b))}};
let G=null,px=W/2,keys={};const GOOD=['🦴','🐟','🥕','🌽'],BAD=['🧦','🍫'];
function start(){G={s:0,l:3,t:30,it:[],last:performance.now(),sp:0,run:true};$('#rw').classList.add('hide');$('#sub').disabled=false;$('#st').textContent='Restart';loop()}
function spawn(){const bad=Math.random()<.28;G.it.push({x:30+Math.random()*(W-60),y:-20,v:2.2+Math.random()*2+G.s/25,bad,e:(bad?BAD:GOOD)[Math.random()*(bad?2:4)|0]})}
function loop(now=performance.now()){if(!G||!G.run)return;const dt=Math.min(.05,(now-G.last)/1000);G.last=now;G.t-=dt;G.sp+=dt;if(G.sp>.55){G.sp=0;spawn()}
 px+=((keys.l?-1:0)+(keys.r?1:0))*380*dt;px=Math.max(50,Math.min(W-50,px));
 G.it.forEach(i=>i.y+=i.v*60*dt);G.it=G.it.filter(i=>{if(i.y>Hh-70&&i.y<Hh-10&&Math.abs(i.x-px)<52){if(i.bad){G.l--;}else G.s++;return false}return i.y<Hh+20});
 x.clearRect(0,0,W,Hh);x.fillStyle='#EEF0FF';x.fillRect(0,0,W,Hh);x.fillStyle='#C6F432';x.fillRect(0,Hh-18,W,18);x.font='34px serif';x.textAlign='center';G.it.forEach(i=>x.fillText(i.e,i.x,i.y));
 x.drawImage(imgs[pet],px-45,Hh-108,90,90);x.fillStyle='#14122B';x.font='700 20px Figtree,sans-serif';x.textAlign='left';x.fillText('Score '+G.s,16,30);x.textAlign='right';x.fillText('Lives '+'♥'.repeat(Math.max(G.l,0))+'   Time '+Math.ceil(Math.max(G.t,0)),W-16,30);
 if(G.t<=0||G.l<=0){G.run=false;end();return}requestAnimationFrame(loop)}
function end(){x.fillStyle='#14122BCC';x.fillRect(0,0,W,Hh);x.fillStyle='#fff';x.textAlign='center';x.font='800 34px Unbounded,sans-serif';x.fillText('Game over: '+G.s,W/2,Hh/2);$('#sc').textContent=G.s;$('#rw').classList.remove('hide');$('#cp').textContent=G.s>=20?'Nice! Save your score to reveal your coupon.':''}
$('#st').onclick=start;addEventListener('keydown',e=>{if(e.code==='Space'&&!(G&&G.run)&&document.activeElement.tagName!=='INPUT'){e.preventDefault();start()}if(['ArrowLeft','KeyA'].includes(e.code)&&document.activeElement.tagName!=='INPUT')keys.l=1;if(['ArrowRight','KeyD'].includes(e.code)&&document.activeElement.tagName!=='INPUT')keys.r=1});addEventListener('keyup',e=>{if(['ArrowLeft','KeyA'].includes(e.code))keys.l=0;if(['ArrowRight','KeyD'].includes(e.code))keys.r=0});
const mv=e=>{const r=cv.getBoundingClientRect(),t=e.touches?e.touches[0]:e;px=Math.max(50,Math.min(W-50,(t.clientX-r.left)/r.width*W))};cv.addEventListener('pointermove',mv);cv.addEventListener('touchmove',mv,{passive:true});
async function lb(){try{const L=await api('/scores');$('#lb').innerHTML=L.length?L.map((s,i)=>`<li><span>${i+1}. ${esc(s.name)}</span><b>${s.score}</b></li>`).join(''):'<li class="note">No scores yet. Be the first.</li>'}catch(e){}}lb();
$('#sub').onclick=async()=>{try{const r=await api('/scores',{body:{name:$('#nm').value||'Player',score:G.s}});$('#cp').textContent=r.coupon?`Your coupon is ${r.coupon}. Enter it on the Book page for 5% off.`:'Score saved. Reach 20 to unlock a coupon.';$('#sub').disabled=true;lb()}catch(e){toast(e.message)}};
x.fillStyle='#EEF0FF';x.fillRect(0,0,W,Hh);x.fillStyle='#14122B';x.font='800 30px Unbounded,sans-serif';x.textAlign='center';x.fillText('Press Start',W/2,Hh/2)</script></body></html>
