<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner dashboard | Pawshift</title><link rel="icon" href="/assets/favicon.svg"><link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Unbounded:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head><body><main><div class="wrap" style="padding-top:30px">
<h2>Owner dashboard</h2><p class="lead">Bookings, payments and corporate leads. The default key is <b>pawshift</b>; set ADMIN_KEY on your server to change it.</p>
<form id="f" style="display:flex;gap:10px;margin-bottom:24px"><input id="k" type="password" placeholder="Admin key" style="max-width:240px;margin:0" required><button class="btn">Open</button></form><p id="m" class="err"></p>
<div class="hide" id="R"><div class="grid g3"><div class="card"><small>Revenue collected</small><div class="big" id="rv"></div></div><div class="card"><small>Paid bookings</small><div class="big" id="pd"></div></div><div class="card"><small>Awaiting payment</small><div class="big" id="up"></div></div></div>
<div class="card" style="margin-top:18px;overflow:auto"><table><thead><tr><th>ID</th><th>Customer</th><th>Pet</th><th>When</th><th>Total</th><th>Status</th></tr></thead><tbody id="tb"></tbody></table></div>
<div class="card" style="margin-top:18px"><h3 style="font-size:18px;margin-bottom:8px">Corporate leads</h3><div id="ls"></div></div></div>
</div></main><script src="/js/common.js"></script>
<script>$('#f').onsubmit=async e=>{e.preventDefault();$('#m').textContent='';try{const r=await api('/admin',{headers:{'x-admin-key':$('#k').value}});$('#R').classList.remove('hide');$('#rv').textContent=inr(r.revenue);$('#pd').textContent=r.paid;$('#up').textContent=r.unpaid;
 $('#tb').innerHTML=r.bookings.map(b=>`<tr><td>${esc(b.id)}</td><td>${esc(b.owner)}</td><td>${esc(b.pet)} (${esc(b.animal)})</td><td>${esc(b.date)}<br>${esc(b.slot)}</td><td>${inr(b.total)}</td><td>${b.payment?esc(b.stages[b.stage]):'Awaiting payment'}</td></tr>`).join('')||'<tr><td colspan=6>No bookings yet.</td></tr>';
 $('#ls').innerHTML=r.leads.map(l=>`<div class="ln"><span>${esc(l.company)} (${esc(l.contact)}, ${esc(l.size)})</span><span>${esc(l.email)}</span></div>`).join('')||'<span class="note">No leads yet.</span>'}catch(x){$('#m').textContent=x.message}}</script></body></html>
