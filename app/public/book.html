<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book a visit | Pawshift</title>
<link rel="icon" href="/assets/favicon.svg"><link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Unbounded:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head><body>
<main><div class="wrap" style="padding-top:30px"><h2>Book a visit</h2><p class="lead">Pick your animal, add services, then pay. Payment here is a demo, so no real money moves.</p>
<div class="build"><div class="card">
<section id="A"><div class="chips" id="an" role="group" aria-label="Animal"></div><div class="chips hide" id="sz" role="group" aria-label="Size"></div><div id="svc"></div>
<h3 style="font-size:18px;margin:18px 0 10px">Plan</h3><div class="chips" id="pl"></div><label style="max-width:320px">Coupon code (optional)<input id="co" placeholder="e.g. WELCOME10" maxlength="20" style="text-transform:uppercase"></label>
<button class="btn" id="go1" disabled>Continue</button></section>
<section id="B" class="hide"><form id="f" autocomplete="on"><div class="grid g2"><label>Your name<input name="owner" required minlength="2" maxlength="60" autocomplete="name"></label><label>Phone (10 digits)<input name="phone" required inputmode="numeric" pattern="[0-9 +]{10,14}" autocomplete="tel"></label>
<label>Pet's name<input name="pet" required maxlength="40"></label><label>Date<input name="date" type="date" required></label></div>
<label>Time slot<select name="slot" id="sl"></select></label><label>Address for the visit<input name="address" required minlength="5" maxlength="140" autocomplete="street-address"></label>
<button type="button" class="btn ghost" id="bk1">Back</button> <button class="btn">Review and pay</button></form></section>
<section id="C" class="hide"><h3 style="font-size:20px">Choose how to pay</h3><div class="pay" id="pm"><label><input type="radio" name="m" value="upi" checked>UPI</label><label><input type="radio" name="m" value="card">Credit or debit card</label><label><input type="radio" name="m" value="cash">Cash on the day</label></div>
<p class="note">This is a demo checkout. Pressing pay simply records a successful payment.</p><button class="btn alt" id="pay">Pay</button></section>
<section id="D" class="hide done" aria-live="polite"></section></div>
<aside class="card sticky"><h3 style="font-size:20px;margin-bottom:10px">Your booking</h3><div id="lines"><span class="note">Add a service to start.</span></div><div id="disc" class="note ok"></div><div class="tot"><span>Total</span><strong id="tot">₹0</strong></div></aside></div></div></main>
<footer>Pawshift demo. Payments are simulated.</footer><script src="/js/common.js"></script><script>
let C,st={animal:new URLSearchParams(location.search).get('animal')||'dog',size:0,items:{},plan:'plus',coupon:''},Q=null,bk=null;
const show=id=>['A','B','C','D'].forEach(x=>$('#'+x).classList.toggle('hide',x!==id));
catalog().then(c=>{C=c;if(!c.animals[st.animal])st.animal='dog';$('#sl').innerHTML=c.slots.map(s=>`<option>${s}</option>`).join('');$('[name=date]').min=new Date().toISOString().slice(0,10);draw()}).catch(e=>toast(e.message));
function chips(el,list,sel,fn){$(el).innerHTML=list.map(([k,l,img])=>`<button type="button" class="chip" aria-pressed="${k==sel}" data-k="${k}">${img?`<img src="/assets/${img}.svg" alt="">`:''}${l}</button>`).join('');$(el).onclick=e=>{const b=e.target.closest('button');if(b)fn(b.dataset.k)}}
function draw(){const an=C.animals[st.animal];chips('#an',Object.entries(C.animals).map(([k,a])=>[k,a.n,k]),st.animal,k=>{st.animal=k;st.items={};draw()});
 $('#sz').classList.toggle('hide',!an.sized);chips('#sz',[[0,'Small'],[1,'Medium'],[2,'Large']],st.size,k=>{st.size=+k;draw()});
 $('#svc').innerHTML=C.services.filter(s=>s.a.includes(st.animal)).map(s=>{const p=s.sz?Math.round(s.p*[1,1.3,1.7][st.size]):s.p;return`<div class="s"><div><b>${esc(s.n)}</b><small>${esc(s.d)}</small></div><b>${inr(p)}</b><div class="q"><button type="button" data-id="${s.id}" data-d="-1" aria-label="Fewer ${esc(s.n)}">-</button><output>${st.items[s.id]||0}</output><button type="button" data-id="${s.id}" data-d="1" aria-label="More ${esc(s.n)}">+</button></div></div>`}).join('');
 chips('#pl',Object.entries(C.plans).map(([k,p])=>[k,p.off?`${p.n}: ${p.off*100}% off at ${p.min}+`:p.n]),st.plan,k=>{st.plan=k;draw()});requote()}
$('#svc').onclick=e=>{const b=e.target.closest('button');if(!b)return;const i=b.dataset.id;st.items[i]=Math.max(0,Math.min(20,(st.items[i]||0)+ +b.dataset.d));$('output',b.parentNode).textContent=st.items[i];requote()};
$('#co').oninput=e=>{st.coupon=e.target.value.trim();requote()};
let tm;function requote(){clearTimeout(tm);tm=setTimeout(async()=>{if(!Object.values(st.items).some(v=>v>0)){Q=null;$('#lines').innerHTML='<span class="note">Add a service to start.</span>';$('#tot').textContent='₹0';$('#disc').textContent='';$('#go1').disabled=true;return}
 try{Q=await api('/quote',{body:st});$('#lines').innerHTML=Q.lines.map(l=>`<div class="ln"><span>${l.q} x ${esc(l.n)}</span><span>${inr(l.t)}</span></div>`).join('')+(Q.discount?`<div class="ln ok"><span>Discount</span><span>-${inr(Q.discount)}</span></div>`:'');$('#tot').textContent=inr(Q.total);$('#disc').textContent=Q.note;$('#go1').disabled=false}catch(e){toast(e.message)}},150)}
$('#go1').onclick=()=>{show('B');scrollTo({top:0,behavior:'smooth'})};$('#bk1').onclick=()=>show('A');
$('#f').onsubmit=async e=>{e.preventDefault();const btn=e.submitter;btn.disabled=true;try{bk=await api('/bookings',{body:{...st,...Object.fromEntries(new FormData(e.target))}});$('#tot').textContent=inr(bk.total);show('C')}catch(x){toast(x.message)}btn.disabled=false};
$('#pay').onclick=async()=>{const b=$('#pay'),m=$('[name=m]:checked').value;b.disabled=true;b.innerHTML='<span class="spin"></span>Processing payment';
 try{await new Promise(r=>setTimeout(r,1400));const r=await api(`/bookings/${bk.id}/pay`,{body:{method:m}});try{localStorage.setItem('pawshift:last',r.id)}catch(e){}
 const p=r.payment;$('#D').innerHTML=`<div class="tick" aria-hidden="true">✓</div><h2 style="font-size:32px">Payment confirmed</h2><p class="lead" style="margin:10px auto">${inr(p.amount)} received by ${p.method==='upi'?'UPI':p.method==='card'?'card':'cash on the day (marked paid for this demo)'}. Receipt ${esc(p.txn)}.</p>
 <div class="card" style="text-align:left;max-width:420px;margin:16px auto"><div class="ln"><span>Booking ID</span><b>${esc(r.id)}</b></div><div class="ln"><span>${esc(r.pet)}</span><span>${esc(r.date)}, ${esc(r.slot)}</span></div><div class="ln"><span>Carer</span><span>${esc(r.carer)}</span></div><div class="ln"><span>Wags earned</span><b>${Math.floor(r.total/10)}</b></div></div>
 <a class="btn" href="/track?id=${encodeURIComponent(r.id)}">Track this visit</a> <a class="btn alt" href="/play">Play while you wait</a>`;show('D')}catch(x){toast(x.message);b.disabled=false;b.textContent='Pay'}};
</script></body></html>
